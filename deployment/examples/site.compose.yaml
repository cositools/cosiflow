# Copy outside the checkout; adapt UID/GID and paths before use.
config_version: 1
deployment:
  name: cosiflow-example
  mode: compose
application:
  image: cosiflow-airflow:site
  public_url: http://127.0.0.1:18081
module-pipelines:
- name: fast-transient-analysis-pipeline
  repository: https://github.com/cositools/fast-transient-analysis-pipeline.git
  ref: v0.3.0
  config: env/fta-pipe.config.yaml
execution:
  default_executor: LocalExecutor
  default_pool_slots: 1
  dag_profiles: {}
runtime:
  uid: 1000
  gid: 1000
services:
  metadata_database:
    host: postgres
    port: 5432
    database: airflow_db
    user: airflow_user
  gcn_database:
    host: gcn-mysql
    port: 3306
    database: gcn
    user: gcn_user
  smtp:
    host: mailhog
    port: 1025
    starttls: false
    ssl: false
compose:
  workspace: ~/cosiflow-runtime/example
  secrets_env_file: ~/.config/cosiflow/runtime.env
  web_port: 18081
  mail_web_port: 18026
  smtp_port: 11025
