# Local-development Compose stack. Shared deployments must publish only their
# HTTPS reverse proxy and inject equivalent values from a secret manager.

x-build-args: &build-args
  UID: ${UID:-501}
  GID: ${GID:-20}

x-airflow-environment: &airflow-environment
  AIRFLOW_HOME: /home/gamma/airflow
  AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
  AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@localhost}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?AIRFLOW__WEBSERVER__SECRET_KEY is required}
  AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW__CORE__INTERNAL_API_SECRET_KEY:?AIRFLOW__CORE__INTERNAL_API_SECRET_KEY is required}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY is required}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-airflow_user}
  POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  GCN_DB_HOST: gcn-mysql
  GCN_DB_PORT: "3306"
  GCN_DB_NAME: ${GCN_DB_NAME:-gcn}
  GCN_DB_USER: ${GCN_DB_USER:-gcn_user}
  GCN_DB_PASSWORD: ${GCN_DB_PASSWORD:?GCN_DB_PASSWORD is required}
  GCN_DB_CONNECT_TIMEOUT: ${GCN_DB_CONNECT_TIMEOUT:-10}
  DISPLAY: ${DISPLAY:-}
  HOST_IP: 127.0.0.1
  MAILHOG_WEBUI_PORT: ${MAILHOG_WEBUI_PORT:-8025}
  AIRFLOW_WEBUI_PORT: ${AIRFLOW_WEBUI_PORT:-8080}
  AIRFLOW__SMTP__SMTP_HOST: mailhog
  AIRFLOW__SMTP__SMTP_PORT: "1025"
  AIRFLOW__SMTP__SMTP_MAIL_FROM: donotreply@cosiflow.alert.errors.it
  AIRFLOW__SMTP__SMTP_STARTTLS: "False"
  AIRFLOW__SMTP__SMTP_SSL: "False"
  COSI_DATA_DIR: ${COSI_DATA_DIR:-/home/gamma/workspace/data}
  COSI_INPUT_DIR: ${COSI_INPUT_DIR:-/home/gamma/workspace/data/input}
  COSI_LOG_DIR: ${COSI_LOG_DIR:-/home/gamma/workspace/log}
  COSI_OBS_DIR: ${COSI_OBS_DIR:-/home/gamma/workspace/data/obs}
  COSI_TRANSIENT_DIR: ${COSI_TRANSIENT_DIR:-/home/gamma/workspace/data/transient}
  COSI_TRIGGER_DIR: ${COSI_TRIGGER_DIR:-/home/gamma/workspace/data/tdrss}
  COSI_MAPS_DIR: ${COSI_MAPS_DIR:-/home/gamma/workspace/data/maps}
  COSI_SOURCE_DIR: ${COSI_SOURCE_DIR:-/home/gamma/workspace/data/source}
  GCN_CONSUMER_TOPICS: ${GCN_CONSUMER_TOPICS:-gcn.classic.text.FERMI_GBM_FIN_POS,gcn.classic.text.FERMI_GBM_FLT_POS,gcn.classic.text.FERMI_GBM_GND_POS,gcn.classic.text.FERMI_GBM_POS_TEST,gcn.classic.text.FERMI_GBM_SUBTHRESH,gcn.classic.text.SWIFT_BAT_GRB_LC,gcn.classic.text.SWIFT_BAT_GRB_POS_ACK,gcn.classic.text.SWIFT_BAT_GRB_POS_TEST,gcn.classic.text.SWIFT_BAT_QL_POS,gcn.classic.text.SWIFT_BAT_SCALEDMAP}
  GCN_HEARTBEAT_DEGRADED_SECONDS: ${GCN_HEARTBEAT_DEGRADED_SECONDS:-30}
  GCN_HEARTBEAT_OFFLINE_SECONDS: ${GCN_HEARTBEAT_OFFLINE_SECONDS:-90}
  GCN_OUTBOUND_TOPIC_DEFAULT: ${GCN_OUTBOUND_TOPIC_DEFAULT:-gcn.notices.cosi.test.alert}
  GCN_BGO_OUTBOUND_TOPIC: ${GCN_BGO_OUTBOUND_TOPIC:-gcn.notices.cosi.bgo.test.alert}
  GCN_GED_OUTBOUND_TOPIC: ${GCN_GED_OUTBOUND_TOPIC:-gcn.notices.cosi.ged.test.alert}
  GCN_OUTBOUND_ALERT_TENSE: ${GCN_OUTBOUND_ALERT_TENSE:-test}
  GCN_OUTBOUND_ALERT_TYPE: ${GCN_OUTBOUND_ALERT_TYPE:-initial}
  GCN_OUTBOUND_RECORD_NUMBER: ${GCN_OUTBOUND_RECORD_NUMBER:-1}
  GCN_OUTBOUND_PRIORITY: ${GCN_OUTBOUND_PRIORITY:-0}
  GCN_MAX_ATTEMPTS: ${GCN_MAX_ATTEMPTS:-3}

x-gcn-client-environment: &gcn-client-environment
  GCN_DB_HOST: gcn-mysql
  GCN_DB_PORT: "3306"
  GCN_DB_NAME: ${GCN_DB_NAME:-gcn}
  GCN_DB_USER: ${GCN_DB_USER:-gcn_user}
  GCN_DB_PASSWORD: ${GCN_DB_PASSWORD:?GCN_DB_PASSWORD is required}
  GCN_DB_CONNECT_TIMEOUT: ${GCN_DB_CONNECT_TIMEOUT:-10}
  GCN_CLIENT_ID: ${GCN_CLIENT_ID:?GCN_CLIENT_ID is required}
  GCN_CLIENT_SECRET: ${GCN_CLIENT_SECRET:?GCN_CLIENT_SECRET is required}
  GCN_DOMAIN: ${GCN_DOMAIN:-gcn.nasa.gov}
  GCN_CONSUMER_GROUP_ID: ${GCN_CONSUMER_GROUP_ID:-cosiflow-gcn-client}
  GCN_CONSUMER_TOPICS: ${GCN_CONSUMER_TOPICS:-gcn.classic.text.FERMI_GBM_FIN_POS,gcn.classic.text.FERMI_GBM_FLT_POS,gcn.classic.text.FERMI_GBM_GND_POS,gcn.classic.text.FERMI_GBM_POS_TEST,gcn.classic.text.FERMI_GBM_SUBTHRESH,gcn.classic.text.SWIFT_BAT_GRB_LC,gcn.classic.text.SWIFT_BAT_GRB_POS_ACK,gcn.classic.text.SWIFT_BAT_GRB_POS_TEST,gcn.classic.text.SWIFT_BAT_QL_POS,gcn.classic.text.SWIFT_BAT_SCALEDMAP}
  GCN_CONSUMER_ENABLED: ${GCN_CONSUMER_ENABLED:-true}
  GCN_CONSUMER_POLL_TIMEOUT: ${GCN_CONSUMER_POLL_TIMEOUT:-1.0}
  GCN_CONSUMER_COMMIT: ${GCN_CONSUMER_COMMIT:-true}
  GCN_PRODUCER_ENABLED: ${GCN_PRODUCER_ENABLED:-false}
  GCN_DRY_RUN: ${GCN_DRY_RUN:-true}
  GCN_REQUIRE_TEST_TOPICS: ${GCN_REQUIRE_TEST_TOPICS:-true}
  GCN_OUTBOUND_TOPIC_DEFAULT: ${GCN_OUTBOUND_TOPIC_DEFAULT:-gcn.notices.cosi.test.alert}
  GCN_TOPIC_ALLOWLIST: ${GCN_TOPIC_ALLOWLIST:-gcn.notices.cosi.test.alert,gcn.notices.cosi.bgo.test.alert,gcn.notices.cosi.ged.test.alert}
  GCN_PUBLISH_POLL_SECONDS: ${GCN_PUBLISH_POLL_SECONDS:-5}
  GCN_PUBLISH_BATCH_SIZE: ${GCN_PUBLISH_BATCH_SIZE:-10}
  GCN_MAX_ATTEMPTS: ${GCN_MAX_ATTEMPTS:-3}
  GCN_PRODUCER_CLIENT_LABEL: ${GCN_PRODUCER_CLIENT_LABEL:-cosiflow-gcn-client}
  GCN_SCHEMA_ROOT: ${GCN_SCHEMA_ROOT:-/app/gcn-schema}
  GCN_COSI_ALERT_SCHEMA: ${GCN_COSI_ALERT_SCHEMA:-/app/gcn-schema/gcn/notices/cosi/alert.schema.json}
  GCN_COSI_ALERT_SCHEMA_URL: ${GCN_COSI_ALERT_SCHEMA_URL:-https://gcn.nasa.gov/schema/main/gcn/notices/cosi/alert.schema.json}
  GCN_INIT_DB_ON_START: ${GCN_INIT_DB_ON_START:-true}
  GCN_HEARTBEAT_DEGRADED_SECONDS: ${GCN_HEARTBEAT_DEGRADED_SECONDS:-30}
  GCN_HEARTBEAT_OFFLINE_SECONDS: ${GCN_HEARTBEAT_OFFLINE_SECONDS:-90}
  GCN_LOG_LEVEL: ${GCN_LOG_LEVEL:-INFO}

x-airflow-common: &airflow-common
  image: cosiflow-airflow:native
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      <<: *build-args
  user: gamma
  environment:
    <<: *airflow-environment
  volumes:
    - ../../envs:/home/gamma/envs
    - ../dags:/home/gamma/airflow/dags
    - ../../:/home/gamma/airflow/modules_pool
    - ../plugins:/home/gamma/airflow/plugins
    - ../pipeline:/home/gamma/airflow/pipeline
    - ../callbacks:/home/gamma/airflow/callbacks
    - ../modules:/home/gamma/airflow/modules
    - ./airflow.cfg:/home/gamma/airflow/airflow.cfg:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ..:/shared_dir
    - ../data/heasarc:/home/gamma/workspace/data
    - ../data/logs:/home/gamma/airflow/logs
  networks:
    - application
    - database

services:
  gcn-mysql:
    image: mysql:8.4
    container_name: cosi_gcn_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${GCN_MYSQL_ROOT_PASSWORD:?GCN_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${GCN_DB_NAME:-gcn}
      MYSQL_USER: ${GCN_DB_USER:-gcn_user}
      MYSQL_PASSWORD: ${GCN_DB_PASSWORD:?GCN_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ../data/gcn_mysql_data:/var/lib/mysql
    networks:
      - database

  gcn-client:
    image: cosiflow-gcn-client:prototype
    build:
      context: ../gcn-client
      dockerfile: Dockerfile
    container_name: cosi_gcn_client
    environment:
      <<: *gcn-client-environment
    depends_on:
      gcn-mysql:
        condition: service_healthy
    command: ["python", "-m", "app.main", "run"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: "on-failure:5"
    stop_grace_period: 20s
    networks:
      - application
      - database

  postgres:
    image: postgres:15
    container_name: cosi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow_user}
      POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ../data/postgres_data:/var/lib/postgresql/data
    networks:
      - database

  airflow-init:
    <<: *airflow-common
    container_name: cosi_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
      gcn-mysql:
        condition: service_healthy
    entrypoint: ["bash", "/home/gamma/entrypoint-airflow.sh", "init"]
    restart: "no"

  airflow:
    <<: *airflow-common
    container_name: cosi_airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    entrypoint: ["bash", "/home/gamma/entrypoint-airflow.sh", "runtime"]
    ports:
      - "127.0.0.1:${AIRFLOW_WEBUI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: "on-failure:5"

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    container_name: cosi_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:${MAILHOG_WEBUI_PORT:-8025}:8025"
    networks:
      - application

networks:
  application:
    internal: false
  database:
    internal: true
