x-airflow-common: &airflow-common
  image: cosiflow-airflow:native
  environment: &airflow-environment
    AIRFLOW_HOME: /tmp/review28-airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/review28/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    AIRFLOW__CORE__KILLED_TASK_CLEANUP_TIME: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "2"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://review28:review28-test-only@postgres:5432/review28
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "1"
    AIRFLOW__SCHEDULER__LOCAL_TASK_JOB_HEARTBEAT_SEC: "1"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "1"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: "1"
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - ./review28/dags:/opt/review28/dags:ro
    - ../../test/performance_test.py:/opt/review28/performance_test.py:ro
    - ./review28/stop_run.py:/opt/review28/stop_run.py:ro

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: review28
      POSTGRES_PASSWORD: review28-test-only
      POSTGRES_DB: review28
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review28 -d review28"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow pools set default_pool 2 "Review 28 two-slot pool"
    profiles: ["tools"]

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
